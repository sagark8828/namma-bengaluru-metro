<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Namma Bengaluru Metro</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

    <header>

        <h1>🚇 Namma Bengaluru Metro</h1>

        <p>Route Finder • Fare • Journey Time • Station Search</p>

    </header>


    <main>

        <section class="route-box">

            <h2>Plan Your Metro Journey</h2>


            <!-- FROM -->

            <label for="fromStation">
                From Station
            </label>

            <input type="text" id="fromStation" placeholder="🔍 Search starting station" autocomplete="off">

            <div id="fromSuggestions" class="suggestions">
            </div>


            <!-- TO -->

            <label for="toStation">
                To Station
            </label>

            <input type="text" id="toStation" placeholder="🔍 Search destination station" autocomplete="off">

            <div id="toSuggestions" class="suggestions">
            </div>
            <button id="swapButton" type="button" class="swap-button">
                ⇅ Swap Stations
            </button>
            <button id="clearButton" type="button" class="clear-button">
                ✕ Clear Search
            </button>

            <button id="locationButton" type="button">
                📍 Find Nearest Metro Station
            </button>

            <div id="nearestStation"></div>


            <!-- STATION DETAILS -->

            <div id="stationDetails"></div>


            <!-- FIND ROUTE -->

            <button onclick="findRoute()">
                🚇 Find Route
            </button>


            <div id="metroMapOverview">

                <h2>🗺️ Bengaluru Metro Map</h2>

                <div class="map-line purple-map">
                    🟣 Purple Line
                </div>

                <div class="map-line green-map">
                    🟢 Green Line
                </div>

                <div class="map-line yellow-map">
                    🟡 Yellow Line
                </div>

            </div>

            <!-- RESULT -->

            <div id="result"></div>
            <!-- ==========================
     INTERACTIVE METRO MAP
========================== -->

            <section id="interactiveMetroMap">

                <h2>🗺️ Bengaluru Metro Map</h2>

                <p class="map-subtitle">
                    Complete station-wise Metro network
                </p>

                <div id="purpleMap" class="metro-map-line"></div>

                <div id="greenMap" class="metro-map-line"></div>

                <div id="yellowMap" class="metro-map-line"></div>

            </section>

        </section>

    </main>


    <script src="script.js"></script>

    <div id="stationPopup" class="station-popup">
        <button class="close-popup" onclick="closeStationPopup()">✕</button>
        <div id="popupContent"></div>
    </div>
</body>

</html>
